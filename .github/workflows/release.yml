name: Windows Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  PROJECT: CalculadoraFilamentoPro.View/CalculadoraFilamentoPro.View.csproj
  RUNTIME: win-x64
  PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish
  INSTALLER_DIR: ${{ github.workspace }}/artifacts/installer

jobs:
  publish-windows:
    name: Publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        shell: pwsh
        run: |
          $tags = @(git tag -l "v*.*" --sort=-v:refname)
          $latest = $null

          foreach ($tag in $tags) {
              if ($tag -match '^v?(\d+)\.(\d+)$') {
                  $latest = [pscustomobject]@{
                      Major = [int]$Matches[1]
                      Minor = [int]$Matches[2]
                  }
                  break
              }
          }

          if ($null -eq $latest) {
              $major = 1
              $minor = 0
          }
          else {
              $major = $latest.Major
              $minor = $latest.Minor + 1

              if ($minor -gt 9) {
                  $major += 1
                  $minor = 0
              }
          }

          $version = "$major.$minor"
          $tag = "v$version"
          $appVersion = ($major * 10) + $minor

          if (git rev-parse -q --verify "refs/tags/$tag") {
              throw "Tag already exists: $tag"
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Next version: $version ($tag), ApplicationVersion=$appVersion"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: |
          dotnet workload install maui --skip-manifest-update

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT `
            --runtime $env:RUNTIME `
            -p:PublishReadyToRun=false

      - name: Publish Windows application
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:PUBLISH_DIR | Out-Null

          dotnet publish $env:PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            --no-restore `
            --output $env:PUBLISH_DIR `
            -p:PublishReadyToRun=false `
            -p:ApplicationDisplayVersion=$env:VERSION `
            -p:ApplicationVersion=$env:APP_VERSION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup `
            --yes `
            --no-progress

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:INSTALLER_DIR | Out-Null

          $iscc = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Inno Setup 6\ISCC.exe'

          if (-not (Test-Path $iscc)) {
              throw "Inno Setup compiler not found"
          }

          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DPublishDir=$env:PUBLISH_DIR" `
            "$env:GITHUB_WORKSPACE\Installer\setup.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path `
            $env:INSTALLER_DIR `
            "CalculadoraFilamentoProSetup.exe"

          if (-not (Test-Path $installer)) {
              throw "Installer not generated: $installer"
          }

          Get-Item $installer |
            Select-Object FullName, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/installer/CalculadoraFilamentoProSetup.exe
          fail_on_unmatched_files: true
