name: Windows Release

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT: CalculadoraFilamentoPro.View/CalculadoraFilamentoPro.View.csproj

  RUNTIME: win-x64

  PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish

  INSTALLER_DIR: ${{ github.workspace }}/artifacts/installer

jobs:
  publish-windows:
    name: Publish Windows installer

    runs-on: windows-latest

    steps:
      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup .NET

        uses: actions/setup-dotnet@v4

        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload

        run: |

          dotnet workload install maui --skip-manifest-update

      - name: Restore

        shell: pwsh

        run: |

          dotnet restore $env:PROJECT `
            --runtime $env:RUNTIME

      - name: Publish Windows

        shell: pwsh

        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:PUBLISH_DIR | Out-Null



          dotnet publish $env:PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            --no-restore `
            --output $env:PUBLISH_DIR

      - name: Install Inno Setup

        run: |

          choco install innosetup --yes --no-progress

      - name: Build installer

        shell: pwsh

        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:INSTALLER_DIR | Out-Null



          $iscc = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Inno Setup 6\ISCC.exe'


          & $iscc `
            "/DPublishDir=$env:PUBLISH_DIR" `
            "$env:GITHUB_WORKSPACE\Installer\setup.iss"

      - name: Upload artifact

        uses: actions/upload-artifact@v4

        with:
          name: windows-installer

          path: artifacts/installer/CalculadoraFilamentoProSetup.exe
